name: Create Release and Upload APK

on:
  push:
    tags:
      - 'v*' # سيتم تشغيل هذا الـ Workflow فقط عندما تقوم برفع Tag جديد يبدأ بـ v (مثل v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب الكود للحصول على الملفات والوصول لمسارات البناء
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. (اختياري لكن مفضل) إعادة بناء التطبيق للتأكد من توفر الملف، 
      # أو يمكنك الاعتماد على الـ Artifacts إذا كنت تفصل الأكيود تماماً.
      # الأبسط والأضمن هنا هو إعادة البناء السريع لضمان وجود الـ APK وجاهزيته للرفع:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 3. إنشاء الـ Release ورفع ملف الـ APK تلقائياً
      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          body: "التحديث الجديد لتطبيقي - تم إنشاؤه وبناؤه تلقائياً عبر GitHub Actions."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
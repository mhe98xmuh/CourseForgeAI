name: Build Android APK

on:
  push:
    branches: [ "main" ] # سيعمل الأكشن تلقائياً عند الدفع لفرع main
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا (تأكد من مطابقة إصدار جافا لمشروعك، مثل 17 أو 11)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # تفعيل الكاش لتسريع البلد في المرات القادمة

    # 3. إعطاء صلاحيات التشغيل لملف الـ Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. بناء نسخة الـ APK (نسخة تصحيح الأخطاء Debug)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. رفع ملف الـ APK الناتج لكي تتمكن من تحميله من GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
